<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WIKILIMINAL</title>
  <style>
    html, body { margin: 0; height: 100%; background: #050709; overflow: hidden; }
    #game { width: 100%; height: 100%; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    /* Old-TV look: scanlines + vignette + faint flicker, layered over the canvas only. */
    #crt {
      position: fixed; inset: 0; pointer-events: none; z-index: 10;
      background:
        repeating-linear-gradient(to bottom, rgba(0,0,0,0.22) 0, rgba(0,0,0,0.22) 1px, transparent 1px, transparent 3px),
        radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.6) 100%);
      animation: crt-flicker 7s infinite;
    }
    @keyframes crt-flicker {
      0%, 95%, 100% { opacity: 1; }
      96% { opacity: 0.85; }
      97% { opacity: 1; }
      98% { opacity: 0.92; }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="crt"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
