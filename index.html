<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#050709" />
  <title>WIKILIMINAL</title>
  <style>
    html, body {
      margin: 0; height: 100%; background: #050709; overflow: hidden;
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game { width: 100vw; height: 100vh; height: 100dvh; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
    /* Old-TV look: scanlines + vignette + faint flicker, layered over the canvas only. */
    #crt {
      position: fixed; inset: 0; pointer-events: none; z-index: 10;
      background:
        repeating-linear-gradient(to bottom, rgba(0,0,0,0.22) 0, rgba(0,0,0,0.22) 1px, transparent 1px, transparent 3px),
        radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.6) 100%);
      animation: crt-flicker 7s infinite;
    }
    @keyframes crt-flicker {
      0%, 95%, 100% { opacity: 1; }
      96% { opacity: 0.85; }
      97% { opacity: 1; }
      98% { opacity: 0.92; }
    }
    /* The game is landscape (16:9): ask phones held upright to rotate. */
    #rotate {
      display: none; position: fixed; inset: 0; z-index: 20; background: #050709;
      color: #c9c6a0; font: 14px monospace; text-align: center;
      align-items: center; justify-content: center; line-height: 1.8;
    }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="crt"></div>
  <div id="rotate">Rotate your device<br />to landscape</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
